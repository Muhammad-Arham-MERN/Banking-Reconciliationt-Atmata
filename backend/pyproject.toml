# بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ
[project]
name = "backend"
version = "1.0.0"
description = "Backend Reconciliation Service for the Bank Reconciliation System"
requires-python = ">=3.13"
dependencies = [
    # Core Framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    # AI Structure Detection (Istikhraj e Data Ma'a AI)
    "openai-agents[litellm]",
    # Data Processing
    "pandas>=2.1.4",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    # Database
    "asyncpg>=0.28.0",
    # Utilities
    "python-dateutil>=2.8.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    "aiofiles>=23.2.1",
    # Security / Encryption (company credential encryption at rest)
    "cryptography>=43.0.0",
    # Notifications (company onboarding request email)
    "resend>=2.49.1",
]

# وَإِنَّ اللَّهَ لَهُوَ خَيْرُ الرَّازِقِينَ
